# ============================================================
# Debot AI Quant MVP - Docker Compose
# 用于本地开发测试，Zeabur 部署时使用其平台配置
# ============================================================

services:
  # ---- PostgreSQL 数据库 ----
  postgres:
    image: postgres:17-alpine
    container_name: debot-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-debot_quant}
      POSTGRES_USER: ${DB_USER:-debot_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # 本地调试用，生产环境注释掉此行
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-debot_user} -d ${DB_NAME:-debot_quant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Playwright 信号采集服务 ----
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: debot-collector
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 数据库
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-debot_quant}
      DB_USER: ${DB_USER:-debot_user}
      DB_PASSWORD: ${DB_PASSWORD}
      # Debot 网站
      DEBOT_BASE_URL: ${DEBOT_BASE_URL:-https://debot.ai}
      DEBOT_SIGNAL_URL: ${DEBOT_SIGNAL_URL:-}
      # 采集参数
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONFIG_FILE: /app/config.json
      COOKIE_FILE: /app/data/cookies.json
    volumes:
      - collector_data:/app/data
      - ./collector/config.json:/app/config.json:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
  collector_data:
