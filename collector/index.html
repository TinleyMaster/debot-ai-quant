<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debot AI Quant - 回测操作台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
.header{background:#161b22;border-bottom:1px solid #30363d;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;color:#58a6ff;font-weight:600}
.header .info{font-size:12px;color:#8b949e}
.layout{display:flex;gap:0;height:calc(100vh - 52px);overflow:hidden}
.panel{overflow-y:auto;padding:16px}
.panel-left{width:380px;min-width:380px;background:#161b22;border-right:1px solid #30363d}
.panel-right{flex:1;display:flex;flex-direction:column}
.section-title{font-size:13px;font-weight:600;color:#58a6ff;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #21262d;text-transform:uppercase;letter-spacing:.5px}
.form-group{margin-bottom:14px}
.form-group label{display:flex;justify-content:space-between;font-size:12px;color:#8b949e;margin-bottom:4px}
.form-group label .val{color:#c9d1d9;font-weight:600}
.form-group select,.form-group input[type=range]{width:100%}
input[type=range]{-webkit-appearance:none;height:6px;background:#21262d;border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#58a6ff;border-radius:50%;cursor:pointer}
select{background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:6px 8px;font-size:13px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#238636;color:#fff}
.btn-primary:hover:not(:disabled){background:#2ea043}
.btn-warning{background:#d29922;color:#0d1117}
.btn-warning:hover:not(:disabled){background:#e3b341}
.btn-danger{background:#da3633;color:#fff}
.btn-group{display:flex;gap:8px;margin-top:16px}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.preset-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#21262d;color:#8b949e;cursor:pointer;border:1px solid #30363d}
.preset-tag:hover{background:#30363d;color:#c9d1d9}
.preset-tag.active{background:#1f6feb33;color:#58a6ff;border-color:#1f6feb}
.stats-row{display:flex;gap:12px;padding:16px;flex-wrap:wrap}
.stat-card{flex:1;min-width:140px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 16px}
.stat-card .label{font-size:11px;color:#8b949e;text-transform:uppercase}
.stat-card .value{font-size:22px;font-weight:700;margin-top:4px}
.stat-card .value.positive{color:#3fb950}
.stat-card .value.negative{color:#f85149}
.stat-card .sub{font-size:11px;color:#8b949e;margin-top:2px}
.tabs{display:flex;gap:0;border-bottom:1px solid #30363d;padding:0 16px}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;color:#8b949e;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:#c9d1d9}
.tab.active{color:#58a6ff;border-bottom-color:#58a6ff}
.tab-content{flex:1;overflow-y:auto;padding:16px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 12px;color:#8b949e;font-weight:600;border-bottom:1px solid #30363d;position:sticky;top:0;background:#0d1117;z-index:1}
td{padding:8px 12px;border-bottom:1px solid #21262d}
tr:hover td{background:#161b22}
.rank{font-weight:700;color:#58a6ff}
.profit-pos{color:#3fb950}
.profit-neg{color:#f85149}
.exit-tp{color:#3fb950;font-size:11px;padding:1px 6px;border-radius:4px;background:#3fb95022}
.exit-sl{color:#f85149;font-size:11px;padding:1px 6px;border-radius:4px;background:#f8514922}
.exit-to{color:#8b949e;font-size:11px;padding:1px 6px;border-radius:4px;background:#8b949e22}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:#8b949e;font-size:14px}
.spinner{width:24px;height:24px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;align-items:center;justify-content:center;height:200px;color:#8b949e;font-size:13px}
#duration{font-size:11px;color:#8b949e;margin-left:8px}
.signal-time{font-size:11px;color:#8b949e}
.contract-link{color:#58a6ff;text-decoration:none;font-family:monospace;font-size:11px}
.contract-link:hover{text-decoration:underline}
/* 信号直播 & K线 */
#signal-table td{white-space:nowrap}
.signal-content{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#8b949e}
.signal-24h-up{color:#3fb950;font-weight:600}
.signal-24h-down{color:#f85149;font-weight:600}
.signal-rank{display:inline-block;background:#1f6feb22;color:#58a6ff;padding:1px 5px;border-radius:4px;font-weight:600;font-size:10px}
.auto-refresh{font-size:11px;color:#3fb950;margin-left:8px}
.kline-panel{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.kline-panel input{flex:1;min-width:200px;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:6px 10px;font-size:13px;font-family:monospace}
.kline-panel select{min-width:200px}
.kline-panel .btn{flex-shrink:0}
.chart-wrapper{position:relative;height:400px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px}
.chart-wrapper canvas{width:100%!important;height:100%!important}
.token-price{font-family:monospace;font-size:11px}
.price-up{color:#3fb950}
.price-down{color:#f85149}
</style>
</head>
<body>
<div class="header">
  <h1>Debot AI Quant - 回测操作台</h1>
  <div class="info">
    <span>买入: 0.1 SOL | 滑点: 20% | DEX费: 0.25% | 优先费: 0.001 SOL</span>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<div class="layout">
  <!-- 左侧参数面板 -->
  <div class="panel panel-left">
    <!-- 基础设置 -->
    <div class="section-title">基础设置</div>
    <div class="form-group">
      <label>买入金额 <span class="val" id="v-buyAmt">1.0 SOL</span></label>
      <input type="range" id="buy_amount_sol" min="0.05" max="5" value="1.0" step="0.05" oninput="var v1=parseFloat(this.value);document.getElementById('v-buyAmt').textContent=v1.toFixed(2)+' SOL'">
    </div>

    <!-- 买入策略 -->
    <div class="section-title">买入策略</div>
    <div class="form-group">
      <label>单币买入次数 <span class="val" id="v-buys">1 次</span></label>
      <select id="max_buys_per_token" onchange="document.getElementById('v-buys').textContent=this.value+' 次'">
        <option value="1" selected>1 次</option>
        <option value="2">2 次</option>
        <option value="3">3 次</option>
        <option value="5">5 次</option>
      </select>
    </div>

    <!-- 卖出策略 -->
    <div class="section-title">卖出策略</div>
    <div class="form-group">
      <label>止盈倍数 <span class="val" id="v-tp">1.0x</span></label>
      <input type="range" id="take_profit" min="60" max="200" value="100" step="5" oninput="var v2=parseInt(this.value);document.getElementById('v-tp').textContent=v2+'%';document.getElementById('v-tp-x').textContent=(v2/100).toFixed(1)+'x'">
      <small id="v-tp-x" style="color:#58a6ff;font-size:10px">1.0x</small>
    </div>
    <div class="form-group">
      <label>止损阈值 <span class="val" id="v-sl">5%</span></label>
      <input type="range" id="stop_loss" min="2" max="30" value="5" step="1" oninput="updateLabel(this,'v-sl','%')">
    </div>
    <div class="form-group">
      <label>最长持仓 <span class="val" id="v-hold">24h</span></label>
      <select id="max_hold_hours" onchange="document.getElementById('v-hold').textContent=this.value+'h'">
        <option value="1">1 小时</option>
        <option value="4">4 小时</option>
        <option value="8">8 小时</option>
        <option value="12">12 小时</option>
        <option value="24" selected>24 小时</option>
        <option value="48">48 小时</option>
      </select>
    </div>

    <!-- 高级过滤 -->
    <div class="section-title">高级过滤</div>
    <div class="form-group" style="display:flex;align-items:center;gap:8px">
      <label style="flex:1;margin:0;cursor:pointer" for="only_first_signal">只跟首次信号</label>
      <input type="checkbox" id="only_first_signal" style="width:18px;height:18px;accent-color:#58a6ff">
    </div>
    <div class="form-group">
      <label>信号确认 <span class="val" id="v-sc">1个/1分钟内</span></label>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="signal_confirm_minutes" style="width:70px" onchange="updateSignalConfirm()">
          <option value="1" selected>1分钟</option>
          <option value="3">3分钟</option>
          <option value="5">5分钟</option>
          <option value="10">10分钟</option>
        </select>
        <span style="font-size:11px;color:#8b949e">内</span>
        <select id="signal_confirm_count" style="width:70px" onchange="updateSignalConfirm()">
          <option value="1">1个</option>
          <option value="2">2个</option>
          <option value="3" selected>3个</option>
          <option value="5">5个</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>代币创建时间 <span class="val" id="v-age">不限</span></label>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="min_token_age_minutes" style="flex:1" onchange="updateAgeLabel()">
          <option value="0" selected>不限 Min</option>
          <option value="5">5 分钟</option>
          <option value="10">10 分钟</option>
          <option value="30">30 分钟</option>
        </select>
        <span style="font-size:11px;color:#8b949e">~</span>
        <select id="max_token_age_hours" style="flex:1" onchange="updateAgeLabel()">
          <option value="0" selected>不限 Max</option>
          <option value="6">6 小时</option>
          <option value="12">12 小时</option>
          <option value="24">24 小时</option>
          <option value="72">3 天</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>币种市值 <span class="val" id="v-mcap">不限</span></label>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="min_market_cap_usd" style="flex:1" onchange="updateMcLabel()">
          <option value="0" selected>不限 Min</option>
          <option value="5000">$5,000</option>
          <option value="10000">$10,000</option>
          <option value="50000">$50,000</option>
          <option value="100000">$100,000</option>
        </select>
        <span style="font-size:11px;color:#8b949e">~</span>
        <select id="max_market_cap_usd" style="flex:1" onchange="updateMcLabel()">
          <option value="0" selected>不限 Max</option>
          <option value="100000">$100K</option>
          <option value="500000">$500K</option>
          <option value="1000000">$1M</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>持有人数量 <span class="val" id="v-hcount">不限</span></label>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="min_holders" style="flex:1" onchange="updateHolderLabel()">
          <option value="0" selected>不限 Min</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
        <span style="font-size:11px;color:#8b949e">~</span>
        <select id="max_holders" style="flex:1" onchange="updateHolderLabel()">
          <option value="0" selected>不限 Max</option>
          <option value="1000">1,000</option>
          <option value="5000">5,000</option>
          <option value="10000">10,000</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>TOP持仓小于 <span class="val" id="v-hr">不限</span></label>
      <select id="max_holder_rate" onchange="var v3=parseFloat(this.value);document.getElementById('v-hr').textContent=v3>0?(v3*100).toFixed(0)+'%':'不限'">
        <option value="0" selected>不限</option>
        <option value="0.05">5%</option>
        <option value="0.10">10%</option>
        <option value="0.20">20%</option>
      </select>
    </div>
    <div class="form-group">
      <label>运行时间段 <span class="val" id="v-runtime">全天</span></label>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="runtime_start_hour" style="flex:1" onchange="updateRuntimeLabel()">
          <option value="0" selected>00:00</option>
          <option value="6">06:00</option>
          <option value="8">08:00</option>
          <option value="12">12:00</option>
          <option value="18">18:00</option>
          <option value="20">20:00</option>
        </select>
        <span style="font-size:11px;color:#8b949e">~</span>
        <select id="runtime_end_hour" style="flex:1" onchange="updateRuntimeLabel()">
          <option value="0" selected>24:00</option>
          <option value="6">06:00</option>
          <option value="8">08:00</option>
          <option value="12">12:00</option>
          <option value="18">18:00</option>
        </select>
      </div>
    </div>

    <!-- 风险控制 -->
    <div class="section-title">风险控制</div>
    <div class="form-group">
      <label>滑点 <span class="val" id="v-slp">30%</span></label>
      <input type="range" id="slippage_pct" min="5" max="50" value="30" step="1" oninput="updateLabel(this,'v-slp','%')">
    </div>
    <div class="form-group">
      <label>优先费 <span class="val" id="v-pfee">0.001 SOL</span></label>
      <select id="priority_fee_sol" onchange="document.getElementById('v-pfee').textContent=parseFloat(this.value).toFixed(3)+' SOL'">
        <option value="0.0001">0.0001 SOL</option>
        <option value="0.001" selected>0.001 SOL</option>
        <option value="0.005">0.005 SOL</option>
        <option value="0.01">0.01 SOL</option>
      </select>
    </div>
    <div class="form-group">
      <label>贿赂费 <span class="val" id="v-bribe">0.003 SOL</span></label>
      <select id="bribe_fee_sol" onchange="document.getElementById('v-bribe').textContent=parseFloat(this.value).toFixed(3)+' SOL'">
        <option value="0">无</option>
        <option value="0.001">0.001 SOL</option>
        <option value="0.003" selected>0.003 SOL</option>
        <option value="0.005">0.005 SOL</option>
        <option value="0.01">0.01 SOL</option>
      </select>
    </div>
    <div class="form-group">
      <label>价格偏差 <span class="val" id="v-pdev">0%</span></label>
      <select id="price_deviation_pct" onchange="document.getElementById('v-pdev').textContent=parseFloat(this.value).toFixed(0)+'%'">
        <option value="0" selected>0%</option>
        <option value="0.01">1%</option>
        <option value="0.03">3%</option>
        <option value="0.05">5%</option>
      </select>
    </div>

    <div class="section-title" style="margin-top:16px">快速预设</div>
    <div class="preset-row" id="presets">
      <span class="preset-tag" data-preset="conservative">保守</span>
      <span class="preset-tag" data-preset="moderate">均衡</span>
      <span class="preset-tag" data-preset="aggressive">激进</span>
      <span class="preset-tag" data-preset="scalp">超短线</span>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="runSingle()" id="btn-single">当前参数回测</button>
      <button class="btn btn-warning" onclick="runGrid()" id="btn-grid">全部迭代回测</button>
    </div>
    <div class="section-title" style="margin-top:16px">定时任务</div>
    <button class="btn" style="width:100%;background:#21262d;color:#8b949e" onclick="loadLatest()">加载最新网格回测报告</button>
    <button class="btn" style="width:100%;margin-top:6px;background:#21262d;color:#8b949e" onclick="loadReport()">加载活跃策略报告</button>
  </div>

  <!-- 右侧结果面板 -->
  <div class="panel-right">
    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="label">已执行</div><div class="value" style="color:#8b949e">-</div><div class="sub">等待回测</div></div>
      <div class="stat-card"><div class="label">胜率</div><div class="value" style="color:#8b949e">-</div><div class="sub">-</div></div>
      <div class="stat-card"><div class="label">总盈亏</div><div class="value" style="color:#8b949e">-</div><div class="sub">-</div></div>
      <div class="stat-card"><div class="label">盈亏比</div><div class="value" style="color:#8b949e">-</div><div class="sub">-</div></div>
      <div class="stat-card"><div class="label">最大回撤</div><div class="value" style="color:#8b949e">-</div><div class="sub">-</div></div>
      <div class="stat-card"><div class="label">耗时</div><div class="value" style="color:#8b949e">-</div><div class="sub">-</div></div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('rank')" id="tab-rank">策略排名</div>
      <div class="tab" onclick="switchTab('detail')" id="tab-detail">交易明细</div>
      <div class="tab" onclick="switchTab('signals')" id="tab-signals">最新信号 <span class="auto-refresh" id="signal-indicator"></span></div>
      <div class="tab" onclick="switchTab('kline')" id="tab-kline">K线行情</div>
    </div>
    <div class="tab-content" id="content-rank">
      <div class="empty">点击「当前参数回测」或「全部迭代回测」开始</div>
    </div>
    <div class="tab-content" id="content-detail" style="display:none">
      <div class="empty">回测完成后查看交易明细</div>
    </div>
    <div class="tab-content" id="content-signals" style="display:none">
      <div class="loading"><div class="spinner"></div>加载最新信号...</div>
    </div>
    <div class="tab-content" id="content-kline" style="display:none">
      <div class="kline-panel">
        <select id="token-select" onchange="onTokenSelect(this.value)" style="min-width:240px">
          <option value="">-- 选择一个代币 --</option>
        </select>
        <span style="color:#8b949e;font-size:12px">或输入合约:</span>
        <input type="text" id="kline-address" placeholder="粘贴合约地址...">
        <button class="btn btn-primary" onclick="loadKline()">查看K线</button>
      </div>
      <div class="chart-wrapper" id="chart-container">
        <div class="empty">选择一个代币或粘贴合约地址查看K线</div>
      </div>
    </div>
  </div>
</div>

<script>
let lastResult = null, currentTab = 'rank';

function updateLabel(el, labelId, suffix) {
  document.getElementById(labelId).textContent = el.tagName === 'SELECT'
    ? el.options[el.selectedIndex].text
    : el.value + suffix;
}

function updateSignalConfirm() {
  const m = document.getElementById('signal_confirm_minutes').value;
  const c = document.getElementById('signal_confirm_count').value;
  document.getElementById('v-sc').textContent = c + '个/' + m + '分钟内';
}
function updateAgeLabel() {
  const mn = document.getElementById('min_token_age_minutes');
  const mx = document.getElementById('max_token_age_hours');
  const minT = mn.value > 0 ? mn.options[mn.selectedIndex].text : 'Min不限';
  const maxT = mx.value > 0 ? mx.options[mx.selectedIndex].text : 'Max不限';
  document.getElementById('v-age').textContent = minT + ' ~ ' + maxT;
}
function updateMcLabel() {
  const mn = document.getElementById('min_market_cap_usd');
  const mx = document.getElementById('max_market_cap_usd');
  const minT = mn.value > 0 ? mn.options[mn.selectedIndex].text : 'Min不限';
  const maxT = mx.value > 0 ? mx.options[mx.selectedIndex].text : 'Max不限';
  document.getElementById('v-mcap').textContent = minT + ' ~ ' + maxT;
}
function updateHolderLabel() {
  const mn = document.getElementById('min_holders');
  const mx = document.getElementById('max_holders');
  const minT = mn.value > 0 ? mn.options[mn.selectedIndex].text : 'Min不限';
  const maxT = mx.value > 0 ? mx.options[mx.selectedIndex].text : 'Max不限';
  document.getElementById('v-hcount').textContent = minT + ' ~ ' + maxT;
}
function updateRuntimeLabel() {
  const s = document.getElementById('runtime_start_hour');
  const e = document.getElementById('runtime_end_hour');
  const st = s.options[s.selectedIndex].text;
  const et = e.options[e.selectedIndex].text;
  document.getElementById('v-runtime').textContent = (s.value==='0' && e.value==='0') ? '全天' : st + ' ~ ' + et;
}

function getParams() {
  return {
    buy_amount_sol: parseFloat(document.getElementById('buy_amount_sol').value),
    max_buys_per_token: parseInt(document.getElementById('max_buys_per_token').value),
    take_profit: parseInt(document.getElementById('take_profit').value) / 100,
    stop_loss: parseInt(document.getElementById('stop_loss').value) / 100,
    max_hold_hours: parseInt(document.getElementById('max_hold_hours').value),
    only_first_signal: document.getElementById('only_first_signal').checked,
    signal_confirm_minutes: parseInt(document.getElementById('signal_confirm_minutes').value),
    signal_confirm_count: parseInt(document.getElementById('signal_confirm_count').value),
    min_token_age_minutes: parseInt(document.getElementById('min_token_age_minutes').value),
    max_token_age_hours: parseInt(document.getElementById('max_token_age_hours').value),
    min_market_cap_usd: parseFloat(document.getElementById('min_market_cap_usd').value),
    max_market_cap_usd: parseFloat(document.getElementById('max_market_cap_usd').value),
    min_holders: parseInt(document.getElementById('min_holders').value),
    max_holders: parseInt(document.getElementById('max_holders').value),
    max_holder_rate: parseFloat(document.getElementById('max_holder_rate').value),
    runtime_start_hour: parseInt(document.getElementById('runtime_start_hour').value),
    runtime_end_hour: parseInt(document.getElementById('runtime_end_hour').value),
    slippage_pct: parseFloat(document.getElementById('slippage_pct').value) / 100,
    priority_fee_sol: parseFloat(document.getElementById('priority_fee_sol').value),
    bribe_fee_sol: parseFloat(document.getElementById('bribe_fee_sol').value),
    price_deviation_pct: parseFloat(document.getElementById('price_deviation_pct').value) / 100,
  };
}

const presets = {
  conservative: { take_profit: 60, stop_loss: 3, max_hold_hours: 4, max_buys_per_token: 1, max_token_age_hours: 24, signal_confirm_count: 2 },
  moderate: { take_profit: 100, stop_loss: 5, max_hold_hours: 12, max_buys_per_token: 3, max_token_age_hours: 0, signal_confirm_count: 1 },
  aggressive: { take_profit: 200, stop_loss: 10, max_hold_hours: 24, max_buys_per_token: 3, max_token_age_hours: 0, signal_confirm_count: 1 },
  scalp: { take_profit: 60, stop_loss: 5, max_hold_hours: 1, max_buys_per_token: 3, max_token_age_hours: 12, signal_confirm_count: 2 },
};

document.getElementById('presets').addEventListener('click', e => {
  if (e.target.classList.contains('preset-tag')) {
    document.querySelectorAll('.preset-tag').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    const p = presets[e.target.dataset.preset];
    document.getElementById('take_profit').value = p.take_profit;
    document.getElementById('stop_loss').value = p.stop_loss;
    document.getElementById('max_hold_hours').value = p.max_hold_hours;
    document.getElementById('max_buys_per_token').value = p.max_buys_per_token;
    document.getElementById('max_token_age_hours').value = p.max_token_age_hours;
    document.getElementById('signal_confirm_count').value = p.signal_confirm_count;
    ['take_profit','stop_loss','max_hold_hours','max_buys_per_token','max_token_age_hours','signal_confirm_count'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.dispatchEvent(new Event(id === 'take_profit' ? 'input' : 'change'));
    });
    updateAgeLabel(); updateSignalConfirm();
  }
});

function setLoading(msg) {
  document.getElementById('content-rank').innerHTML = `<div class="loading"><div class="spinner"></div>${msg}</div>`;
  document.getElementById('content-detail').style.display = 'none';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-rank').classList.add('active');
  currentTab = 'rank';
}

async function runSingle() {
  setLoading('正在回测...');
  document.getElementById('btn-single').disabled = true;
  document.getElementById('btn-grid').disabled = true;
  const start = Date.now();
  try {
    const resp = await fetch('/backtest-custom', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(getParams()), signal: AbortSignal.timeout(120000) });
    const data = await resp.json();
    lastResult = data;
    showSingleResult(data, (Date.now()-start)/1000);
  } catch(e) {
    document.getElementById('content-rank').innerHTML = `<div class="empty">请求失败: ${e.message}</div>`;
  }
  document.getElementById('btn-single').disabled = false;
  document.getElementById('btn-grid').disabled = false;
}

async function runGrid() {
  setLoading('正在全部迭代回测 (864组参数)...');
  document.getElementById('btn-single').disabled = true;
  document.getElementById('btn-grid').disabled = true;
  const start = Date.now();
  try {
    const resp = await fetch('/run-backtest', { signal: AbortSignal.timeout(600000) });
    const data = await resp.json();
    lastResult = data;
    showGridResult(data, (Date.now()-start)/1000);
  } catch(e) {
    document.getElementById('content-rank').innerHTML = `<div class="empty">请求失败: ${e.message}</div>`;
  }
  document.getElementById('btn-single').disabled = false;
  document.getElementById('btn-grid').disabled = false;
}

async function loadReport() {

      lastResult = data;

    }

    document.getElementById('content-rank').innerHTML = `<div class="empty">请求失败: ${e.message}</div>`;
  }
}

async function loadLatest() {
  setLoading('加载中...');
  document.getElementById('btn-single').disabled = true;
  document.getElementById('btn-grid').disabled = true;
  try {
    const resp = await fetch('/run-backtest', { signal: AbortSignal.timeout(600000) });
    const data = await resp.json();

    showGridResult(data, 0);
  } catch(e) {

function showSingleResult(data, dur) {
  updateStats(data.summary, null, dur);

  // 数据质量警告
  showDataQuality(data.data_quality);

  if (data.trades && data.trades.length > 0) {
    document.getElementById('content-rank').innerHTML = `<div class="empty" style="color:#8b949e">单次回测完成 — 切换到「交易明细」查看详情</div>`;
    renderTradeTable(data.trades);
  } else {
    document.getElementById('content-rank').innerHTML = '<div class="empty">无符合条件的交易</div>';
    document.getElementById('content-detail').innerHTML = '<div class="empty">无交易记录</div>';
  }
}

function showGridResult(data, dur) {
  const strategies = data.top_strategies || [];
  updateStats(strategies.length > 0 ? strategies[0] : null, data.combinations, dur);

  // 数据质量警告
  showDataQuality(data.data_quality);

  if (strategies.length === 0) {
    document.getElementById('content-rank').innerHTML = '<div class="empty">无符合条件的策略</div>';
    return;
  }

  let html = '<table><thead><tr><th>#</th><th>止盈</th><th>止损</th><th>持仓</th><th>单币买</th><th>确认</th><th>市值Min</th><th>交易</th><th>胜率</th><th>收益</th><th>盈亏$</th><th>盈亏比</th><th>回撤</th></tr></thead><tbody>';
  strategies.forEach((r,i) => {
    const p = r.params;
    const cls = r.total_profit_pct >= 0 ? 'profit-pos' : 'profit-neg';
    html += `<tr>
      <td class="rank">#${i+1}</td>
      <td>${(p.take_profit*100).toFixed(0)}%</td>
      <td>${(p.stop_loss*100).toFixed(0)}%</td>
      <td>${p.max_hold_hours}h</td>
      <td>${p.max_buys_per_token}</td>
      <td>${p.signal_confirm_count || 1}个</td>
      <td>${(p.min_market_cap_usd||0) > 0 ? '$'+(p.min_market_cap_usd/1000).toFixed(0)+'k' : '不限'}</td>
      <td>${r.total_trades}</td>
      <td>${(r.win_rate*100).toFixed(1)}%</td>
      <td class="${cls}">${(r.total_profit_pct*100).toFixed(2)}%</td>
      <td class="${cls}">${r.total_profit_usd >= 0 ? '+' : ''}$${r.total_profit_usd.toFixed(2)}</td>
      <td>${r.profit_factor >= 999 ? '∞' : r.profit_factor.toFixed(2)}</td>
      <td>${(r.max_drawdown_pct*100).toFixed(1)}%</td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('content-rank').innerHTML = html;
}

function renderTradeTable(trades) {
  let html = '<table><thead><tr><th>代币</th><th>合约</th><th>买入价</th><th>卖出价</th><th>收益率</th><th>盈亏$</th><th>持仓</th><th>退出</th><th>信号时间</th></tr></thead><tbody>';
  trades.forEach(t => {
    const cls = t.profit_pct >= 0 ? 'profit-pos' : 'profit-neg';
    const reason = t.exit_reason === 'take_profit' ? `<span class="exit-tp">止盈</span>` : t.exit_reason === 'stop_loss' ? `<span class="exit-sl">止损</span>` : `<span class="exit-to">超时</span>`;
    html += `<tr>
      <td><b>${t.token_symbol}</b></td>
      <td><a class="contract-link" href="https://dexscreener.com/solana/${t.contract_address}" target="_blank">${t.contract_address.slice(0,6)}...${t.contract_address.slice(-4)}</a></td>
      <td>${fmtPrice(t.entry_price)}</td>
      <td>${fmtPrice(t.exit_price)}</td>
      <td class="${cls}">${(t.profit_pct*100).toFixed(2)}%</td>
      <td class="${cls}">${t.profit_usd >= 0 ? '+' : ''}$${t.profit_usd.toFixed(4)}</td>
      <td>${t.hold_hours.toFixed(1)}h</td>
      <td>${reason}</td>
      <td class="signal-time">${t.signal_time ? t.signal_time.slice(0,16) : '-'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('content-detail').innerHTML = html;
}

function fmtPrice(p) {
  if (p < 0.0001) return p.toExponential(4);
  if (p < 1) return p.toFixed(8);
  return p.toFixed(4);
}

function updateStats(summary, combinations, dur) {
  const row = document.getElementById('stats-row');
  if (!summary) {
    row.innerHTML = '<div class="stat-card"><div class="label">组合数</div><div class="value" style="color:#8b949e">'+(combinations||'-')+'</div><div class="sub">耗时 '+(dur||0).toFixed(1)+'s</div></div>';
    return;
  }
  const pCls = summary.total_profit_pct >= 0 ? 'positive' : 'negative';
  const uCls = (summary.total_profit_usd || 0) >= 0 ? 'positive' : 'negative';
  row.innerHTML = `
    <div class="stat-card"><div class="label">交易笔数</div><div class="value" style="color:#58a6ff">${summary.total_trades}</div><div class="sub">${summary.winning_trades} 胜 / ${summary.losing_trades} 负</div></div>
    <div class="stat-card"><div class="label">胜率</div><div class="value">${(summary.win_rate*100).toFixed(1)}%</div><div class="sub">${combinations ? combinations+' 组合' : ''}</div></div>
    <div class="stat-card"><div class="label">总盈亏</div><div class="value ${pCls}">${(summary.total_profit_pct*100).toFixed(2)}%</div><div class="sub ${uCls}">${(summary.total_profit_usd||0)>=0?'+':''}$${(summary.total_profit_usd||0).toFixed(2)}</div></div>
    <div class="stat-card"><div class="label">盈亏比</div><div class="value">${summary.profit_factor===Infinity?'∞':summary.profit_factor.toFixed(2)}</div><div class="sub">均盈 ${(summary.avg_profit_pct*100).toFixed(1)}% / 均亏 ${(summary.avg_loss_pct*100).toFixed(1)}%</div></div>
    <div class="stat-card"><div class="label">最大回撤</div><div class="value negative">${(summary.max_drawdown_pct*100).toFixed(1)}%</div><div class="sub">连亏 ${summary.max_consecutive_losses} 笔</div></div>
    <div class="stat-card"><div class="label">耗时</div><div class="value" style="color:#8b949e">${dur.toFixed(1)}s</div><div class="sub">${combinations ? combinations+' 组' : '单次'}</div></div>`;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('content-rank').style.display = tab === 'rank' ? '' : 'none';
  document.getElementById('content-detail').style.display = tab === 'detail' ? '' : 'none';
  document.getElementById('content-signals').style.display = tab === 'signals' ? '' : 'none';
  document.getElementById('content-kline').style.display = tab === 'kline' ? '' : 'none';

  if (tab === 'signals') {
    if (!signalsLoaded) { loadSignals(); startSignalRefresh(); }
  }
  if (tab === 'kline' && !tokensLoaded) {
    loadTokenList();
  }
}

function showDataQuality(dq) {
  const row = document.getElementById('stats-row');
  const existing = document.getElementById('dq-warning');
  if (existing) existing.remove();

  if (!dq || dq.sufficient) return;

  const warn = document.createElement('div');
  warn.id = 'dq-warning';
  warn.style.cssText = 'margin:0 16px 8px;padding:10px 14px;background:#d2992233;border:1px solid #d2992266;border-radius:6px;font-size:12px;color:#d29922';
  warn.innerHTML = `<b>数据不足</b>: 仅 ${dq.tokens_with_multiple_timepoints || 0}/${dq.total_tokens || 0} 个代币有≥2个时间点的快照。
    回测无法模拟跨时间价格变动，结果不可靠。
    <br>需要定期运行「行情拉取」积累时间序列数据 (当前仅 ${dq.total_unique_timepoints || 0} 个时间点)。`;
  row.parentNode.insertBefore(warn, row);
}

// ============================================================
// 最新信号直播
// ============================================================
let signalsLoaded = false, signalTimer = null;

function startSignalRefresh() {
  if (signalTimer) return;
  signalTimer = setInterval(loadSignals, 30000); // 每30秒刷新
  document.getElementById('signal-indicator').textContent = '● 直播';
}

function stopSignalRefresh() {
  if (signalTimer) { clearInterval(signalTimer); signalTimer = null; }
  document.getElementById('signal-indicator').textContent = '';
}

async function loadSignals() {
  try {
    const resp = await fetch('/latest-signals?limit=50');
    const data = await resp.json();
    if (!data.success) throw new Error(data.error);
    signalsLoaded = true;
    renderSignalTable(data.signals);
  } catch(e) {
    document.getElementById('content-signals').innerHTML = `<div class="empty">加载失败: ${e.message}</div>`;
  }
}

function formatSignalContent(raw) {
  if (!raw || raw === '-') return '-';
  // 24h 涨跌着色
  let html = raw.replace(/(24h:\s*)([+-][\d.]+%)/g,
    (_, prefix, pct) => prefix + `<span class="${pct.startsWith('+') ? 'signal-24h-up' : 'signal-24h-down'}">${pct}</span>`);
  // 排名 #N 徽章化
  html = html.replace(/(^|\s)(#\d+)(?=\s|$)/g, '$1<span class="signal-rank">$2</span>');
  return html;
}

function renderSignalTable(signals) {
  if (!signals || signals.length === 0) {
    document.getElementById('content-signals').innerHTML = '<div class="empty">暂无信号数据</div>';
    return;
  }
  const now = new Date();
  let html = `<div style="font-size:11px;color:#8b949e;margin-bottom:8px">共 ${signals.length} 条信号 · 自动刷新中</div>`;
  html += '<table id="signal-table"><thead><tr><th>时间</th><th>代币</th><th>合约</th><th>市值</th><th>信号信息</th></tr></thead><tbody>';
  signals.forEach(s => {
    const sigTime = s.signal_time ? new Date(s.signal_time) : null;
    const age = sigTime ? Math.floor((now - sigTime) / 60000) : '?';
    const ageStr = age < 1 ? '刚刚' : age < 60 ? `${age}分钟前` : age < 1440 ? `${Math.floor(age/60)}小时前` : `${Math.floor(age/1440)}天前`;
    const poolVal = s.pool_value ? (s.pool_value >= 1e6 ? '$'+(s.pool_value/1e6).toFixed(1)+'M' : s.pool_value >= 1e3 ? '$'+(s.pool_value/1e3).toFixed(1)+'K' : '$'+s.pool_value.toFixed(0)) : '-';
    const signalInfo = formatSignalContent(s.signal_content || '');
    html += `<tr>
      <td class="signal-time">${ageStr}</td>
      <td><b>${s.token_symbol || '?'}</b></td>
      <td><a class="contract-link" href="https://debot.ai/token/solana/${s.contract_address}" target="_blank">${s.contract_address.slice(0,6)}...${s.contract_address.slice(-4)}</a></td>
      <td>${poolVal}</td>
      <td class="signal-content" title="${(s.signal_content || '').replace(/"/g,'&quot;')}">${signalInfo}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('content-signals').innerHTML = html;
}

// ============================================================
// K线行情
// ============================================================
let tokensLoaded = false, klineChart = null;

async function loadTokenList() {
  try {
    const resp = await fetch('/tracked-tokens');
    const data = await resp.json();
    if (!data.success) throw new Error(data.error);
    tokensLoaded = true;
    const sel = document.getElementById('token-select');
    sel.innerHTML = '<option value="">-- 选择一个代币 --</option>';
    data.tokens.forEach(t => {
      const price = t.price_usd ? (t.price_usd < 0.0001 ? t.price_usd.toExponential(2) : '$'+t.price_usd.toFixed(6)) : '';
      const symbol = t.symbol || t.name || t.contract_address.slice(0,8);
      sel.innerHTML += `<option value="${t.contract_address}">${symbol} ${price ? '('+price+')' : ''}</option>`;
    });
  } catch(e) {
    console.error('加载代币列表失败:', e);
  }
}

function onTokenSelect(addr) {
  if (addr) {
    document.getElementById('kline-address').value = addr;
    loadKline();
  }
}

async function loadKline() {
  const addr = document.getElementById('kline-address').value.trim();
  if (!addr) {
    document.getElementById('chart-container').innerHTML = '<div class="empty">请选择代币或粘贴合约地址</div>';
    return;
  }
  document.getElementById('chart-container').innerHTML = '<div class="loading"><div class="spinner"></div>加载K线数据...</div>';
  try {
    const resp = await fetch(`/token-kline?address=${encodeURIComponent(addr)}&limit=200`);
    const data = await resp.json();
    if (!data.success) throw new Error(data.error);
    if (!data.kline || data.kline.length === 0) {
      document.getElementById('chart-container').innerHTML = '<div class="empty">该代币暂无行情快照数据</div>';
      return;
    }
    renderChart(data.kline, addr);
  } catch(e) {
    document.getElementById('chart-container').innerHTML = `<div class="empty">加载失败: ${e.message}</div>`;
  }
}

function renderChart(klineData, addr) {
  document.getElementById('chart-container').innerHTML = '<canvas id="klineCanvas"></canvas>';

  const labels = klineData.map(d => {
    const t = new Date(d.snapshot_time);
    return t.toLocaleString('zh', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  });
  const prices = klineData.map(d => d.price_usd);
  const volumes = klineData.map(d => d.volume_h24_usd || 0);

  // 计算价格变化方向
  const firstPrice = prices[0];
  const lastPrice = prices[prices.length - 1];
  const pctChange = firstPrice > 0 ? ((lastPrice - firstPrice) / firstPrice * 100) : 0;
  const changeCls = pctChange >= 0 ? 'price-up' : 'price-down';
  const changeSign = pctChange >= 0 ? '+' : '';

  const ctx = document.getElementById('klineCanvas').getContext('2d');

  if (klineChart) klineChart.destroy();

  klineChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: '价格 (USD)',
        data: prices,
        borderColor: '#58a6ff',
        backgroundColor: 'rgba(88,166,255,0.1)',
        fill: true,
        tension: 0.2,
        pointRadius: 0,
        yAxisID: 'y',
      }, {
        label: '24h 成交量 (USD)',
        data: volumes,
        borderColor: 'rgba(139,148,158,0.4)',
        backgroundColor: 'rgba(139,148,158,0.15)',
        fill: true,
        tension: 0.2,
        pointRadius: 0,
        yAxisID: 'y1',
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { color: '#8b949e', font: { size: 11 }, boxWidth: 12, padding: 12 } },
        tooltip: {
          backgroundColor: '#161b22',
          borderColor: '#30363d',
          borderWidth: 1,
          titleColor: '#c9d1d9',
          bodyColor: '#c9d1d9',
          callbacks: {
            label: function(ctx) {
              if (ctx.datasetIndex === 0) return '价格: $' + ctx.raw.toExponential(4);
              return '成交量: $' + (ctx.raw >= 1000 ? (ctx.raw/1000).toFixed(1)+'k' : ctx.raw.toFixed(0));
            }
          }
        },
        subtitle: {
          display: true,
          text: `${addr.slice(0,8)}...${addr.slice(-6)} | ${klineData.length} 个快照 | 区间 ${changeSign}${pctChange.toFixed(2)}%`,
          color: '#8b949e', font: { size: 10 },
          padding: { bottom: 8 }
        }
      },
      scales: {
        x: {
          ticks: { color: '#484f58', font: { size: 10 }, maxRotation: 45, maxTicksLimit: 20 },
          grid: { color: '#21262d' }
        },
        y: {
          type: 'logarithmic',
          position: 'left',
          title: { display: true, text: '价格 (USD)', color: '#58a6ff', font: { size: 10 } },
          ticks: { color: '#58a6ff', font: { size: 9 }, callback: v => v < 0.0001 ? v.toExponential(2) : '$'+v.toFixed(8) },
          grid: { color: '#21262d' }
        },
        y1: {
          type: 'linear',
          position: 'right',
          title: { display: true, text: '成交量 (USD)', color: '#8b949e', font: { size: 10 } },
          ticks: { color: '#8b949e', font: { size: 9 }, callback: v => v >= 1000 ? (v/1000).toFixed(0)+'k' : v },
          grid: { display: false },
          min: 0,
        }
      }
    }
  });

  // 添加价格变化标签
  const label = document.createElement('div');
  label.style.cssText = `position:absolute;top:8px;right:12px;font-size:14px;font-weight:700;color:${pctChange>=0?'#3fb950':'#f85149'}`;
  label.textContent = `${changeSign}${pctChange.toFixed(2)}%`;
  document.getElementById('chart-container').style.position = 'relative';
  document.getElementById('chart-container').appendChild(label);
}

// 页面加载后自动触发初始 label 更新
document.querySelectorAll('select, input[type=range]').forEach(f => {
  f.dispatchEvent(new Event('input'));
});
